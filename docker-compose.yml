# One-command demo: `docker compose up`.
# Brings up a Postgres seeded with a tiny ecommerce dataset and the MCP server
# pointing at it. Hit http://localhost:3001/health and you're in business.
#
# This is a developer-evaluation setup, not production. The bearer key is fixed
# below; rotate it (or remove auth entirely with MCP_API_KEYS="") for your own
# use. Don't ship this compose file as-is.
#
# Host ports are overridable so you can run alongside other MCP servers:
#   MCP_HOST_PORT=37301 POSTGRES_HOST_PORT=55432 docker compose up

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/seed:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  warehouse-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: http
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 3001
      MCP_ALLOWED_ORIGINS: http://localhost:3000
      # Demo-only key. Generate your own with `openssl rand -hex 24`.
      MCP_API_KEYS: demo-key-change-me:reader
      WAREHOUSE_TYPE: postgres
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: warehouse
      PG_USER: mcp_reader
      PG_PASSWORD: mcp_reader_demo_pw
      PG_SSL: "false"
      AUDIT_DIR: /app/audit
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-3001}:3001"
    volumes:
      - mcp-audit:/app/audit
    restart: unless-stopped

volumes:
  pg-data:
  mcp-audit:
